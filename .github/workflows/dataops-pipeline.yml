name: DataOps Pipeline — GMMCO

on:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - 'data_quality/**'
      - 'sample_data/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

env:
  DATABRICKS_HOST: https://dbc-8e912ed6-1406.cloud.databricks.com
  PYTHON_VERSION: "3.11"

jobs:

  # ── JOB 1: DATA QUALITY GATE ──────────────────────────────
  data-quality-gate:
    name: Data Quality Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pandas

      - name: Regenerate sample data
        run: python sample_data/generate_data.py

      - name: Schema validation gate
        run: python data_quality/validate_schema.py

      - name: Data quality checks
        run: python data_quality/validate_data.py

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: data_quality/

# ── JOB 2: DEPLOY NOTEBOOKS ───────────────────────────────
  deploy-notebooks:
    name: Deploy Notebooks to Databricks
    runs-on: ubuntu-latest
    needs: data-quality-gate
    env:
      DATABRICKS_HOST: https://dbc-8e912ed6-1406.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
            | sh
          databricks --version

      - name: Create workspace folders
        run: |
          databricks workspace mkdirs /gmmco-poc/bronze || true
          databricks workspace mkdirs /gmmco-poc/silver || true
          databricks workspace mkdirs /gmmco-poc/gold   || true
          echo "Workspace folders ready."

      - name: Deploy Bronze notebook
        run: |
          databricks workspace import /gmmco-poc/bronze/01_bronze_ingest \
            --file notebooks/bronze/01_bronze_ingest.py \
            --language PYTHON \
            --overwrite
          echo "Bronze notebook deployed."

      - name: Deploy Silver notebook
        run: |
          databricks workspace import /gmmco-poc/silver/02_silver_transform \
            --file notebooks/silver/02_silver_transform.py \
            --language PYTHON \
            --overwrite
          echo "Silver notebook deployed."

      - name: Deploy Gold notebook
        run: |
          databricks workspace import /gmmco-poc/gold/03_gold_aggregate \
            --file notebooks/gold/03_gold_aggregate.py \
            --language PYTHON \
            --overwrite
          echo "Gold notebook deployed."

      - name: Verify deployment
        run: |
          echo "Deployed notebooks:"
          databricks workspace list /gmmco-poc/bronze
          databricks workspace list /gmmco-poc/silver
          databricks workspace list /gmmco-poc/gold

  # ── JOB 3: TRIGGER DATABRICKS PIPELINE ───────────────────
  trigger-pipeline:
    name: Trigger Databricks Pipeline Run
    runs-on: ubuntu-latest
    needs: deploy-notebooks
    env:
      DATABRICKS_HOST: https://dbc-8e912ed6-1406.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Install Databricks CLI
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
            | sh

      - name: Trigger and wait for pipeline
        run: |
          echo "Triggering GMMCO DataOps pipeline..."

          RUN_ID=$(databricks jobs run-now \
            ${{ secrets.DATABRICKS_JOB_ID }} \
            --no-wait \
            --output json | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['run_id'])")

          echo "Run ID: $RUN_ID"
          echo "Waiting for completion..."

          for i in {1..20}; do
            sleep 30

            STATUS=$(databricks jobs get-run $RUN_ID \
              --output json | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          state=d.get('state',{})
          lc=state.get('life_cycle_state','')
          rs=state.get('result_state','')
          print(f'{lc}:{rs}')
          ")

            echo "Poll $i — Status: $STATUS"

            if [[ $STATUS == TERMINATED:SUCCESS ]]; then
              echo "✅ Pipeline completed successfully"
              exit 0
            elif [[ $STATUS == TERMINATED:* ]]; then
              echo "❌ Pipeline failed: $STATUS"
              exit 1
            fi
          done

          echo "❌ Pipeline timed out"
          exit 1

      - name: Notify success
        run: |
          echo "✅ DataOps Pipeline Complete"
          echo "  Data quality : passed"
          echo "  Notebooks    : deployed"
          echo "  Bronze → Silver → Gold : complete"